<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2by4 — CPP Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --accent: #e8ff00;
    --text: #f0f0f0;
    --text-dim: #555;
    --text-mid: #888;
    --red: #ff4444;
    --yellow: #ffaa00;
    --green: #00ff88;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 32px;
    height: 48px;
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.05em;
  }

  .nav-sep { color: var(--text-dim); font-size: 12px; }

  .nav-page {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-mid);
    letter-spacing: 0.05em;
  }

  .nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .nav-link {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.15s;
  }

  .nav-link:hover { color: var(--text); }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 12px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }

  .refresh-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .page {
    max-width: 700px;
    margin: 0 auto;
    padding: 56px 32px 80px;
  }

  .heading {
    margin-bottom: 48px;
  }

  .heading-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .heading-date {
    font-size: 26px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .heading-meta {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .client-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .client-row {
    display: flex;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }

  .client-row:first-child { border-top: 1px solid var(--border); }

  .client-name {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .client-numbers {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .client-sub {
    text-align: right;
  }

  .sub-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .sub-value {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-mid);
  }

  .cpp-block {
    text-align: right;
    min-width: 100px;
  }

  .cpp-7d-block {
    text-align: right;
    min-width: 90px;
    border-left: 1px solid var(--border);
    padding-left: 24px;
  }

  .cpp-7d-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .cpp-7d-value {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text-mid);
  }

  .cpp-7d-loading {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    animation: fade 1.2s ease-in-out infinite;
  }

  .cpp-vs {
    font-family: var(--mono);
    font-size: 10px;
    margin-top: 3px;
  }

  .cpp-vs.better { color: var(--green); }
  .cpp-vs.worse  { color: var(--red); }

  .cpp-number {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }

  .cpp-number.good   { color: var(--green); }
  .cpp-number.warn   { color: var(--yellow); }
  .cpp-number.over   { color: var(--red); }
  .cpp-number.none   { color: var(--text-dim); font-size: 20px; font-weight: 400; }

  .cpp-delta {
    font-family: var(--mono);
    font-size: 10px;
    margin-top: 4px;
  }

  .cpp-delta.good  { color: var(--green); }
  .cpp-delta.warn  { color: var(--yellow); }
  .cpp-delta.over  { color: var(--red); }

  .error-row .client-name { color: var(--text-dim); font-size: 14px; }
  .error-msg {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--red);
  }

  .footer-summary {
    margin-top: 40px;
    padding-top: 20px;
    display: flex;
    gap: 40px;
  }

  .footer-stat-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .footer-stat-value {
    font-family: var(--mono);
    font-size: 16px;
    color: var(--text-mid);
  }

  .loading-row {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    animation: fade 1.2s ease-in-out infinite;
  }

  .loading-row:first-child { border-top: 1px solid var(--border); }

  @keyframes fade {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">2×4</a>
  <span class="nav-sep">/</span>
  <span class="nav-page">CPP Daily</span>
  <div class="nav-right">
    <a href="/" class="nav-link">← Brain</a>
    <button class="refresh-btn" id="refresh-btn" onclick="load()">Refresh</button>
  </div>
</nav>

<div class="page">
  <div class="heading">
    <div class="heading-label">Sticker Funnel · Account CPP</div>
    <div class="heading-date" id="heading-date">Yesterday</div>
    <div class="heading-meta" id="heading-meta">Loading...</div>
  </div>

  <div class="client-list" id="client-list">
    <div class="loading-row">Loading clients...</div>
    <div class="loading-row">—</div>
    <div class="loading-row">—</div>
  </div>

  <div class="footer-summary" id="footer-summary" style="display:none;">
    <div>
      <div class="footer-stat-label">Total Spend</div>
      <div class="footer-stat-value" id="stat-spend">—</div>
    </div>
    <div>
      <div class="footer-stat-label">Total Purchases</div>
      <div class="footer-stat-value" id="stat-purchases">—</div>
    </div>
    <div>
      <div class="footer-stat-label">Blended CPP</div>
      <div class="footer-stat-value" id="stat-cpp">—</div>
    </div>
  </div>
</div>

<script>
function fmt$(n) {
  if (n == null || isNaN(n) || n === 0) return n === 0 ? '$0.00' : '—';
  return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fmtInt(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString();
}

function cppClass(cpp, target) {
  if (cpp == null) return 'none';
  const r = cpp / target;
  if (r <= 1.0)  return 'good';
  if (r <= 1.15) return 'warn';
  return 'over';
}

function deltaLabel(cpp, target) {
  if (cpp == null) return null;
  const diff = cpp - target;
  const pct = (diff / target * 100).toFixed(0);
  return (diff >= 0 ? '+' : '') + pct + '% vs $' + target + ' target';
}

async function load() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = 'Loading...';

  // Fire both requests in parallel — render daily immediately, patch 7D when ready
  const dailyPromise = fetch('/api/cpp-daily').then(r => r.json());
  const weekPromise  = fetch('/api/cpp-7day').then(r => r.json());

  try {
    const rows = await dailyPromise;
    render(rows);
    btn.disabled = false;
    btn.textContent = 'Refresh';

    // 7D loads in background — patch each row when it arrives
    weekPromise.then(weekRows => {
      const byId = {};
      for (const r of weekRows) byId[r.id] = r;
      for (const [id, w] of Object.entries(byId)) {
        const el = document.getElementById(`7d-${id}`);
        if (!el) continue;
        if (w.error) {
          el.innerHTML = `<div class="cpp-7d-label">7D Avg</div><div class="cpp-7d-value" style="color:var(--red);font-size:11px;">err</div>`;
        } else {
          const dayCpp = parseFloat(document.getElementById(`cpp-${id}`)?.dataset.cpp);
          let vsHtml = '';
          if (dayCpp && w.cpp) {
            const diff = dayCpp - w.cpp;
            const pct = (diff / w.cpp * 100).toFixed(0);
            const cls = diff <= 0 ? 'better' : 'worse';
            vsHtml = `<div class="cpp-vs ${cls}">${diff <= 0 ? '' : '+'}${pct}% vs avg</div>`;
          }
          el.innerHTML = `<div class="cpp-7d-label">7D Avg</div><div class="cpp-7d-value">${fmt$(w.cpp)}</div>${vsHtml}`;
        }
      }
    }).catch(() => {
      document.querySelectorAll('[id^="7d-"]').forEach(el => {
        el.innerHTML = `<div class="cpp-7d-label">7D Avg</div><div class="cpp-7d-value" style="color:var(--text-dim);">—</div>`;
      });
    });

  } catch (e) {
    document.getElementById('client-list').innerHTML =
      `<div class="loading-row" style="color:var(--red);">Error: ${e.message}</div>`;
    document.getElementById('heading-meta').textContent = 'Failed to load';
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
}

function render(rows) {
  const firstValid = rows.find(r => r.date);
  if (firstValid) {
    const d = new Date(firstValid.date + 'T12:00:00');
    document.getElementById('heading-date').textContent =
      d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  document.getElementById('heading-meta').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

  const valid = rows.filter(r => !r.error);
  const totalSpend = valid.reduce((s, r) => s + (r.spend || 0), 0);
  const totalPurchases = valid.reduce((s, r) => s + (r.purchases || 0), 0);
  const blended = totalPurchases > 0 ? totalSpend / totalPurchases : null;

  document.getElementById('stat-spend').textContent = fmt$(totalSpend);
  document.getElementById('stat-purchases').textContent = fmtInt(totalPurchases);
  document.getElementById('stat-cpp').textContent = fmt$(blended);
  document.getElementById('footer-summary').style.display = 'flex';

  if (!rows.length) {
    document.getElementById('client-list').innerHTML = `<div class="loading-row">No sticker clients found.</div>`;
    return;
  }

  rows.sort((a, b) => {
    if (a.error && !b.error) return 1;
    if (!a.error && b.error) return -1;
    return (b.cpp ?? 0) - (a.cpp ?? 0);
  });

  document.getElementById('client-list').innerHTML = rows.map(row => {
    if (row.error) {
      return `<div class="client-row error-row">
        <span class="client-name">${row.name || row.id}</span>
        <span class="error-msg">${row.error}</span>
      </div>`;
    }

    const cls = cppClass(row.cpp, row.cppTarget);
    const delta = deltaLabel(row.cpp, row.cppTarget);

    return `<div class="client-row">
      <span class="client-name">${row.name}</span>
      <div class="client-numbers">
        <div class="client-sub">
          <div class="sub-label">Spend</div>
          <div class="sub-value">${fmt$(row.spend)}</div>
        </div>
        <div class="client-sub">
          <div class="sub-label">Purchases</div>
          <div class="sub-value">${fmtInt(row.purchases)}</div>
        </div>
        <div class="cpp-block">
          <div class="cpp-number ${cls}" id="cpp-${row.id}" data-cpp="${row.cpp ?? ''}">${row.cpp != null ? fmt$(row.cpp) : '—'}</div>
          ${delta ? `<div class="cpp-delta ${cls}">${delta}</div>` : ''}
        </div>
        <div class="cpp-7d-block" id="7d-${row.id}">
          <div class="cpp-7d-label">7D Avg</div>
          <div class="cpp-7d-loading">loading...</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

load();
</script>
</body>
</html>
