<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2by4 — CPP Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --accent: #e8ff00;
    --accent-dim: rgba(232, 255, 0, 0.12);
    --accent-mid: rgba(232, 255, 0, 0.4);
    --text: #f0f0f0;
    --text-dim: #666;
    --text-mid: #999;
    --red: #ff4444;
    --yellow: #ffaa00;
    --green: #00ff88;
    --red-dim: rgba(255, 68, 68, 0.1);
    --yellow-dim: rgba(255, 170, 0, 0.1);
    --green-dim: rgba(0, 255, 136, 0.1);
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 24px;
    height: 52px;
    flex-shrink: 0;
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-decoration: none;
  }

  .logo span { color: var(--text-dim); font-weight: 400; }

  .nav-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.05em;
    padding: 5px 10px;
    border: 1px solid transparent;
    transition: all 0.15s;
  }

  .nav-link:hover { border-color: var(--border); color: var(--text); }
  .nav-link.active { color: var(--accent); border-color: var(--accent-mid); background: var(--accent-dim); }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .refresh-btn {
    background: var(--accent-dim);
    border: 1px solid var(--accent-mid);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .refresh-btn:hover { background: var(--accent); color: var(--bg); }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .last-updated {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  main {
    flex: 1;
    padding: 32px 40px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  .page-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .page-subtitle {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 28px;
  }

  .summary-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
  }

  .summary-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 20px;
    flex: 1;
  }

  .summary-stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .summary-stat-value {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .summary-stat-value.green { color: var(--green); }
  .summary-stat-value.red   { color: var(--red); }
  .summary-stat-value.yellow { color: var(--yellow); }

  .table-wrap {
    border: 1px solid var(--border);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  th {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 16px;
    text-align: left;
    font-weight: 400;
  }

  th.right { text-align: right; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td {
    padding: 14px 16px;
    font-size: 14px;
    color: var(--text);
    vertical-align: middle;
  }

  td.right {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
  }

  .client-name-cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .client-name-main {
    font-weight: 500;
    color: var(--text);
  }

  .client-tz {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  .cpp-cell {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }

  .cpp-value {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
  }

  .cpp-value.good   { color: var(--green); }
  .cpp-value.warn   { color: var(--yellow); }
  .cpp-value.over   { color: var(--red); }
  .cpp-value.none   { color: var(--text-dim); }

  .cpp-delta {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
  }

  .cpp-delta.good   { background: var(--green-dim);  color: var(--green); }
  .cpp-delta.warn   { background: var(--yellow-dim); color: var(--yellow); }
  .cpp-delta.over   { background: var(--red-dim);    color: var(--red); }

  .target-badge {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-mid);
  }

  .error-row td {
    color: var(--red);
    font-family: var(--mono);
    font-size: 11px;
  }

  .date-cell {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-mid);
  }

  .skeleton { animation: shimmer 1.5s infinite; }

  @keyframes shimmer {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  .skeleton-row td {
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">2×4 <span>BRAIN</span></a>
  <a href="/" class="nav-link">Brain + Briefing</a>
  <a href="/cpp-daily.html" class="nav-link active">CPP Daily</a>
  <div class="header-right">
    <div class="status-dot" id="status-dot" style="display:none;"></div>
    <span class="last-updated" id="last-updated">—</span>
    <button class="refresh-btn" id="refresh-btn" onclick="load()">↻ REFRESH</button>
  </div>
</header>

<main>
  <div class="page-title">Sticker Funnel</div>
  <div class="page-subtitle" id="page-subtitle">CPP — Yesterday</div>

  <div class="summary-bar" id="summary-bar">
    <div class="summary-stat">
      <div class="summary-stat-label">Total Spend</div>
      <div class="summary-stat-value" id="stat-spend">—</div>
    </div>
    <div class="summary-stat">
      <div class="summary-stat-label">Total Purchases</div>
      <div class="summary-stat-value" id="stat-purchases">—</div>
    </div>
    <div class="summary-stat">
      <div class="summary-stat-label">Blended CPP</div>
      <div class="summary-stat-value" id="stat-cpp">—</div>
    </div>
    <div class="summary-stat">
      <div class="summary-stat-label">On Target</div>
      <div class="summary-stat-value" id="stat-on-target">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th class="right">Date</th>
          <th class="right">Spend</th>
          <th class="right">Purchases</th>
          <th class="right">CPP Target</th>
          <th class="right">CPP Yesterday</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="skeleton-row">
          <td colspan="6" class="skeleton" style="text-align:center;padding:40px;">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script>
async function load() {
  const btn = document.getElementById('refresh-btn');
  const dot = document.getElementById('status-dot');
  btn.disabled = true;
  btn.textContent = '↻ LOADING';
  dot.style.display = 'none';

  try {
    const res = await fetch('/api/cpp-daily');
    const rows = await res.json();
    render(rows);
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    dot.style.display = 'block';
  } catch (e) {
    document.getElementById('table-body').innerHTML =
      `<tr class="error-row"><td colspan="6">Failed to load: ${e.message}</td></tr>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '↻ REFRESH';
  }
}

function fmt$(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fmtInt(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString();
}

function tzLabel(tz) {
  try {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' })
      .formatToParts(new Date());
    return parts.find(p => p.type === 'timeZoneName')?.value || tz;
  } catch { return tz; }
}

function cppClass(cpp, target) {
  if (cpp == null) return 'none';
  const ratio = cpp / target;
  if (ratio <= 1.0) return 'good';
  if (ratio <= 1.15) return 'warn';
  return 'over';
}

function render(rows) {
  // Summary stats
  const valid = rows.filter(r => !r.error && r.cpp != null);
  const totalSpend = rows.filter(r => !r.error).reduce((s, r) => s + (r.spend || 0), 0);
  const totalPurchases = rows.filter(r => !r.error).reduce((s, r) => s + (r.purchases || 0), 0);
  const blendedCpp = totalPurchases > 0 ? totalSpend / totalPurchases : null;
  const onTarget = valid.filter(r => r.cpp <= r.cppTarget).length;

  document.getElementById('stat-spend').textContent = fmt$(totalSpend);
  document.getElementById('stat-purchases').textContent = fmtInt(totalPurchases);

  const cppEl = document.getElementById('stat-cpp');
  cppEl.textContent = fmt$(blendedCpp);
  cppEl.className = 'summary-stat-value';
  if (blendedCpp != null && valid.length) {
    const avgTarget = valid.reduce((s, r) => s + r.cppTarget, 0) / valid.length;
    cppEl.classList.add(blendedCpp <= avgTarget ? 'green' : blendedCpp <= avgTarget * 1.15 ? 'yellow' : 'red');
  }

  const onTargetEl = document.getElementById('stat-on-target');
  onTargetEl.textContent = valid.length ? `${onTarget} / ${valid.length}` : '—';
  onTargetEl.className = 'summary-stat-value' + (valid.length && onTarget === valid.length ? ' green' : valid.length && onTarget === 0 ? ' red' : '');

  // Use the most common date in results for the subtitle
  const dates = rows.filter(r => r.date).map(r => r.date);
  if (dates.length) {
    const dateLabel = new Date(dates[0] + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('page-subtitle').textContent = `CPP — ${dateLabel}`;
  }

  const tbody = document.getElementById('table-body');

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-dim);font-family:var(--mono);font-size:12px;">No sticker clients found</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(row => {
    if (row.error) {
      return `<tr class="error-row">
        <td>${row.name || row.id}</td>
        <td colspan="5">Error: ${row.error}</td>
      </tr>`;
    }

    const cls = cppClass(row.cpp, row.cppTarget);
    const delta = row.cpp != null ? row.cpp - row.cppTarget : null;
    const deltaPct = delta != null ? (delta / row.cppTarget * 100) : null;
    const deltaLabel = deltaPct != null
      ? (deltaPct >= 0 ? '+' : '') + deltaPct.toFixed(0) + '%'
      : null;

    return `<tr>
      <td>
        <div class="client-name-cell">
          <span class="client-name-main">${row.name}</span>
          <span class="client-tz">${tzLabel(row.tz)}</span>
        </div>
      </td>
      <td class="right date-cell">${row.date}</td>
      <td class="right">${fmt$(row.spend)}</td>
      <td class="right">${fmtInt(row.purchases)}</td>
      <td class="right"><span class="target-badge">${fmt$(row.cppTarget)}</span></td>
      <td class="right">
        <div class="cpp-cell">
          <span class="cpp-value ${cls}">${row.cpp != null ? fmt$(row.cpp) : '—'}</span>
          ${deltaLabel ? `<span class="cpp-delta ${cls}">${deltaLabel}</span>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

load();
</script>
</body>
</html>
